<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="dashboard-header(portalTitle, portalEmoji)" class="header-health py-4 px-6 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
        <div class="logo-badge text-xl">🏥</div>
        <div>
            <h1 class="text-xl font-bold text-health-700">MediFlow Connect</h1>
            <p class="text-xs text-health-500"><span th:text="${portalEmoji}">⚕️</span> <span th:text="${portalTitle}">Staff Portal</span></p>
        </div>
    </div>
    <nav class="flex items-center space-x-2 md:space-x-4">
        <a href="/" class="nav-emoji-link hidden sm:inline-flex"><span>🏠</span> Home</a>
        <form th:action="@{/logout}" method="post" class="inline-block">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-danger text-sm py-2 px-4">🚪 Logout</button>
        </form>
    </nav>
</header>
</body>
</html>
